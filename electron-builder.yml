# electron-builder config (spec §12.2). Targets: macOS arm64 DMG and Windows x64 NSIS. Unsigned hackathon build.
appId: tech.slothspend.desktop
productName: SlothSpend
copyright: Copyright © 2026 Souptik Sarkar
directories:
  output: release
  buildResources: build # icon.icns, icon.ico, icon.png, entitlements.mac.plist (see design/icons/README.md)
files:
  - out/**
  - package.json
  # Runtime icons read by the main process (icon.png, icon-macos.png); unpacked from the asar below.
  - resources/**
asarUnpack:
  - resources/**
extraResources:
  # The PyInstaller onedir engine → <app>/Contents/Resources/engine (macOS) or resources\engine (Windows).
  # Build it first: npm run engine:build
  - from: engine/dist/slothspend-engine
    to: engine
artifactName: SlothSpend-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signature ("-"): Apple Silicon refuses to run unsigned code, and this is a hackathon build with no
  # Developer ID (spec §12.5). The hardened runtime is off because ad-hoc builds can't use library validation
  # with the PyInstaller engine's bundled libraries.
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  title: SlothSpend ${version}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SlothSpend
  uninstallDisplayName: SlothSpend
npmRebuild: false # no native Node modules
publish: null
