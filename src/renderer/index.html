<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SlothSpend</title>
    <!-- Fonts are bundled (no CDN): the app must work with Wi-Fi off. connect-src allows only the loopback engine. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
