# Packaged builds (spec §12.3). PyInstaller only builds for the host OS/arch, so each target has its own runner.
# Run manually from the Actions tab, or push a tag like v0.1.0 to also publish a GitHub Release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (arm64)
            platform: mac
          - os: windows-latest # x64
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements*

      # Same version as requirements.lock (2.14.1+cpu satisfies ==2.14.1), so pip doesn't fetch torch twice.
      - name: CPU-only PyTorch (Windows)
        if: matrix.platform == 'win'
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Build engine
        working-directory: engine
        run: |
          pip install -r requirements.lock pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9
          pyinstaller slothspend_engine.spec --noconfirm --clean

      # On failure, the output tail becomes an annotation, which is readable without opening the job log.
      - name: Smoke-test engine binary
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          if ! python engine/scripts/smoke_test.py > smoke.log 2>&1; then
            cat smoke.log
            python -c "import sys; t=open('smoke.log', encoding='utf-8', errors='replace').read().splitlines()[-40:]; print('::error title=Engine smoke test failed::' + '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in t))"
            exit 1
          fi
          cat smoke.log

      - name: Build and package app
        run: |
          npm ci
          npm run build
          npx electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SlothSpend-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Unsigned builds: publish checksums so a download can be verified.
      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: SlothSpend ${{ github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS.txt
